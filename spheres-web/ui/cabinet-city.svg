    <path d="M283 414v-8l11 5v8m11 10v-13l11 5v13" fill="none" stroke="#857a9f" stroke-width="5"/>
    <path d="m344 435 0-18c0-9 18-16 18-7v17Z" fill="#59627e"/>
    <path d="m334 449 42-19" stroke="#d9cae2" stroke-width="3"/>

    <path d="m619 406 56-25 70 31-59 29Z" fill="#41696c" opacity=".45"/>
    <path d="M622 386c0-35 27-65 49-55 16 8 30 32 30 54v31l-30 14-49-23Z" fill="url(#glass)"/>
    <path d="M652 373c0-33 24-49 41-38 21 13 37 34 37 53v29l-29 13-49-25Z" fill="url(#glass)"/>
    <path d="M622 386c0-35 27-65 49-55l22 4c21 13 37 34 37 53v29l-29 13-79-23Z" fill="none" stroke="#cadcd0" stroke-width="3"/>
