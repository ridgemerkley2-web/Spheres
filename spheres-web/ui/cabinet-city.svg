  </g>

  <!-- Small planted details make the miniature feel cared for. -->
  <use href="#tree" x="256" y="367"/>
  <use href="#round-tree" x="754" y="396"/>
  <use href="#tree" x="580" y="466"/>
  <use href="#tree" x="225" y="417" transform="translate(67 125) scale(.72)"/>
  <use href="#round-tree" x="407" y="472" transform="translate(122 142) scale(.7)"/>
  <use href="#tree" x="750" y="434" transform="translate(180 104) scale(.76)"/>
  <g fill="#a3c4a6">
