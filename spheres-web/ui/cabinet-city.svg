    <path d="M641 395v-28m0 13c-17 0-16-15-16-15 16-1 16 15 16 15m1 5c17 0 17-15 17-15-16-1-17 15-17 15M684 412v-26m0 9c-13 0-14-12-14-12 13-1 14 12 14 12" fill="#8eb699" stroke="#789f87" stroke-width="2"/>
  </g>

  <!-- A tiny arched footbridge keeps the garden's winding route continuous. -->
  <g>
    <path d="M464 431c10-24 45-32 71-18v19c-22-13-51-4-61 16l-10-4Z" fill="#a79177"/>
    <path d="M461 430c13-29 48-36 77-19l-4 8c-26-13-54-6-66 20Z" fill="#ebd4ad"/>
