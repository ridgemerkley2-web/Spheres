    <ellipse cx="246" cy="397" rx="11" ry="5"/><ellipse cx="711" cy="451" rx="19" ry="7"/>
  </g>
  <g opacity=".9">
    <use href="#flower" x="365" y="468"/><use href="#flower" x="383" y="475"/>
    <use href="#flower" x="606" y="447"/><use href="#flower" x="620" y="443"/>
    <use href="#flower" x="725" y="454"/><use href="#flower" x="699" y="460"/>
  </g>
  <g fill="none" stroke="#dbc9a2" stroke-linecap="round">
    <path d="M397 418v-24m0 0c-8-1-9-6-9-6" stroke-width="3"/>
    <path d="M722 401v-22m0 0c-7-1-8-6-8-6" stroke-width="3"/>
  </g>
  <circle cx="389" cy="387" r="4" fill="#f1dbaa"/>
  <circle cx="714" cy="373" r="4" fill="#f1dbaa"/>
  <path d="M592 486h25m-18 7h9M306 447l17 6m-9 2 8 3M563 353l14 5" stroke="#c6d3b8" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
</svg>
