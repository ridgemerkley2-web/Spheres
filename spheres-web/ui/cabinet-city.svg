<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="city-title city-desc">
  <title id="city-title">The prosperity garden</title>
  <desc id="city-desc">An illustrated miniature civic city on a floating garden, with a golden treasury, mint towers, a lavender library, a glass conservatory and a little bridge over a teal river. An orbiting sun lights the skyline.</desc>
  <defs>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#344958"/><stop offset="1" stop-color="#182b3d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#759f94"/><stop offset=".55" stop-color="#527c77"/><stop offset="1" stop-color="#365860"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cce7ce"/><stop offset="1" stop-color="#91c6b5"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddd1ee"/><stop offset="1" stop-color="#a39dc6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fae6b5"/><stop offset="1" stop-color="#d5b778"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#99cece"/><stop offset=".48" stop-color="#69aeb2"/><stop offset="1" stop-color="#427f92"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bbdeda" stop-opacity=".95"/><stop offset="1" stop-color="#609a9d" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#dfc88d" stop-opacity=".18"/><stop offset="1" stop-color="#dfc88d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground-shadow">
      <stop stop-color="#0a1627" stop-opacity=".62"/><stop offset="1" stop-color="#0a1627" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#142837" flood-opacity=".25"/>
    </filter>
    <g id="tree">
      <ellipse cx="0" cy="8" rx="18" ry="7" fill="#26494e" opacity=".35"/>
      <path d="M0 7V-35" stroke="#d3bf98" stroke-width="5" stroke-linecap="round"/>
      <path d="M-1-19-13-31M0-12 12-27" fill="none" stroke="#d3bf98" stroke-width="3" stroke-linecap="round"/>
      <path d="M-24-36c0-14 8-29 24-36 16 7 25 22 25 36 0 13-10 23-25 23s-24-10-24-23Z" fill="url(#mint)"/>
      <path d="M0-61v37M0-41l-11-10M0-31l12-12" fill="none" stroke="#639b89" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="round-tree">
      <ellipse cx="0" cy="8" rx="15" ry="6" fill="#26494e" opacity=".35"/>
      <path d="M0 6V-31" stroke="#d7c6a7" stroke-width="4" stroke-linecap="round"/>
      <circle cy="-38" r="24" fill="#b8acd0"/>
      <path d="M0-53v32M0-36l-10-8M0-29l10-9" fill="none" stroke="#8b80aa" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="flower">
      <path d="M0 0v-9" stroke="#a7c8a4" stroke-width="2"/>
      <circle cy="-12" r="4" fill="#f2d299"/>
    </g>
    <g id="spark" fill="#e8d5a8">
      <path d="M0-7 1.8-1.8 7 0 1.8 1.8 0 7-1.8 1.8-7 0-1.8-1.8Z"/>
    </g>
  </defs>

  <!-- A quiet astronomical crest leaves room for the cabinet's own typography. -->
  <circle cx="546" cy="206" r="188" fill="url(#halo)"/>
  <g fill="none" stroke="#c6b98f" stroke-width="1.3">
    <ellipse cx="524" cy="206" rx="247" ry="134" transform="rotate(-16 524 206)" opacity=".19"/>
    <path d="M272 184c78-133 328-150 474-9" stroke-dasharray="3 10" opacity=".32"/>
    <path d="M322 97c38-32 86-51 139-56M659 90c58 36 96 90 101 140" opacity=".24"/>
  </g>
  <circle cx="628" cy="120" r="47" fill="url(#gold)"/>
  <circle cx="628" cy="120" r="57" fill="none" stroke="#e8d5a8" stroke-width="1" opacity=".22"/>
  <path d="M573 119c21 22 81 20 112-8" fill="none" stroke="#f7e5b8" stroke-width="2" opacity=".8"/>
  <circle cx="292" cy="166" r="5" fill="#a9cfc7"/>
  <circle cx="736" cy="175" r="3" fill="#d6c4e2"/>
  <use href="#spark" x="375" y="103"/>
  <use href="#spark" x="748" y="279" transform="rotate(14 748 279)"/>
  <use href="#spark" x="232" y="299" transform="scale(.75) translate(77 100)"/>
  <circle cx="442" cy="67" r="2" fill="#d9c7e5" opacity=".7"/>
  <circle cx="792" cy="231" r="2" fill="#9cc6bd" opacity=".8"/>

  <!-- The city sits on a hand-cut, layered garden island. -->
  <ellipse cx="487" cy="547" rx="352" ry="62" fill="url(#ground-shadow)"/>
  <path d="M171 399c23-39 141-88 277-94 159-7 300 42 359 102l-2 54c-87 77-273 120-421 82-85-21-175-52-211-89Z" fill="url(#island)"/>
  <path d="M176 434c112 78 310 119 492 47 49-19 96-41 134-66" fill="none" stroke="#93b8ad" stroke-opacity=".18" stroke-width="3"/>
  <path d="M193 468c58 30 101 48 159 61M614 512c66-16 111-37 148-58" fill="none" stroke="#111e2e" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
  <path d="M171 399c31-50 158-90 285-94 147-5 286 40 351 102-48 57-193 103-313 99-148-5-262-51-323-107Z" fill="url(#grass)"/>
  <path d="M190 400c97 65 194 85 303 88 106 4 226-28 293-80" fill="none" stroke="#b2c6a3" stroke-opacity=".27" stroke-width="2"/>

  <!-- A stream runs through the garden, falling softly over its cut edge. -->
  <path d="M617 335c-53 10-18 51-65 65-46 13-88 11-95 32-7 23 38 31 39 73l42-3c-1-38-43-58-28-68 15-11 67-8 93-32 30-27 1-39 40-57Z" fill="url(#water)"/>
  <path d="m496 505 2 40c11 2 27 1 40-2v-41" fill="#619aab" opacity=".8"/>
  <path d="M502 501v38M510 504v32M529 501v36" stroke="#a8d8d4" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <path d="M632 342c-50 16-3 49-62 63M514 442c8 17 18 30 17 43" fill="none" stroke="#c4e1d6" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>

  <!-- Winding warm paths connect homes, learning and the treasury. -->
  <path d="M223 404c60 9 88 21 132 31 58 14 79-23 113-45 38-26 92-18 126-4 31 14 76 39 136 31" fill="none" stroke="#42686a" stroke-width="24" stroke-linecap="round" opacity=".4"/>
  <path d="M223 400c60 9 88 21 132 31 58 14 79-23 113-45 38-26 92-18 126-4 31 14 76 39 136 31" fill="none" stroke="#d2c3a0" stroke-width="18" stroke-linecap="round"/>
  <path d="M332 353c-19 29-9 57 23 78M666 343c-2 31-4 49-14 65" fill="none" stroke="#d2c3a0" stroke-width="11" stroke-linecap="round"/>

  <!-- A compact, terraced skyline: dimensional faces, rounded corners and lit windows. -->
  <g filter="url(#soft-shadow)">
    <path d="m346 202 49-21 46 22v159l-49 23-46-25Z" fill="#6d9e99"/>
    <path d="m346 202 49 22v161l-49-25Z" fill="url(#mint)"/>
    <path d="m346 202 49-21 46 22-46 21Z" fill="#dfebd5"/>
    <path d="m367 184 28-13 24 12v14l-24 12-28-13Z" fill="#98beb0"/>
    <path d="m367 184 28 12 24-13-24-12Z" fill="#d4e6cd"/>
    <path d="M358 232v17m13-11v17m-13 0v17m13-11v17m-13 0v17m13-11v17m-13 0v17m13-11v17" stroke="#659a93" stroke-width="5"/>
    <path d="m408 236 19-9m-19 31 19-9m-19 31 19-9m-19 31 19-9m-19 31 19-9" stroke="#b9d7bf" stroke-width="5" opacity=".7"/>

    <path d="m287 280 36-17 33 17v104l-36 17-33-17Z" fill="#8a87b2"/>
    <path d="m287 280 33 16v105l-33-17Z" fill="url(#lilac)"/>
    <path d="m287 280 36-17 33 17-36 16Z" fill="#e3d9ed"/>
    <path d="m296 307 14 6m-14 14 14 6m-14 14 14 6m-14 14 14 6" stroke="#8d85ac" stroke-width="5"/>
    <path d="m330 309 16-7m-16 28 16-7m-16 28 16-7" stroke="#c9bfdb" stroke-width="4"/>

    <path d="m628 245 42-18 47 24v135l-43 20-46-23Z" fill="#609798"/>
    <path d="m628 245 46 23v138l-46-23Z" fill="url(#mint)"/>
    <path d="m628 245 42-18 47 24-43 17Z" fill="#d5e6cf"/>
    <path d="M640 279v70m13-63v70" stroke="#79aaa0" stroke-width="5"/>
    <path d="m687 285 17-8m-17 29 17-8m-17 29 17-8m-17 29 17-8" stroke="#acd4c3" stroke-width="4" opacity=".8"/>
    <path d="m640 248 28-12 31 15-28 12Z" fill="#7baaa0"/>
    <path d="m663 244 8-4 10 5-9 4Z" fill="#c5dec2"/>
  </g>

