      <path d="M529 325v39M554 315v39M579 305v39"/>
    </g>
    <g stroke="#ac966f" stroke-width="2" stroke-linecap="round" opacity=".65">
      <path d="M446 308v41M468 317v40M491 326v40"/>
    </g>
    <path d="m422 357 89 35 93-37M417 365l94 37 98-40" fill="none" stroke="#f1dab0" stroke-width="3"/>
    <circle cx="510" cy="273" r="12" fill="#ead5a9" stroke="#a99063" stroke-width="1.5"/>
    <path d="m510 263 2.5 6.7 7 .3-5.5 4.4 1.8 6.6-5.8-3.9-5.8 3.9 1.8-6.6-5.5-4.4 7-.3Z" fill="#a88f60"/>
  </g>

