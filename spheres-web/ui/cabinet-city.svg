  <g filter="url(#soft-shadow)">
    <path d="m411 365 103-36 102 38-103 47Z" fill="#536b68" opacity=".5"/>
    <path d="m412 354 99-34 101 39v18l-101 42-99-41Z" fill="#b79e74"/>
