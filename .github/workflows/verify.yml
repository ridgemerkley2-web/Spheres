name: Verify SPHERES
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold Windows full-history checkout took 13 minutes in run 36695935387.
    # Allow the unchanged suites to finish after that provenance-required setup.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install avatar test dependencies
        run: python -m pip install --only-binary=:all: -r tools/avatars/requirements-test.txt
      - name: Retain the exact historical successor harness source
        run: |
          node -e "const cp=require('node:child_process'),fs=require('node:fs');const r=JSON.parse(fs.readFileSync('docs/campaign-certification/S24/preparation/successor-fixtures/evidence/result.json','utf8'));const sha=r.harness.revision;if(!/^[0-9a-f]{40}$/.test(sha))throw Error('Invalid historical source pin');if(cp.spawnSync('git',['cat-file','-e',sha+'^{commit}']).status!==0)cp.execFileSync('git',['fetch','--no-tags','origin',sha],{stdio:'inherit'});cp.execFileSync('git',['cat-file','-e',sha+'^{commit}']);"
      # Independent of the native build: both suites must report even when
      # the other fails, and neither should delay the other's feedback.
      - run: node tools/ui/run-unit.cjs
      - name: Enforce current geometry and visible-scene budgets
        run: node tools/ui/bench_art.cjs --check
      - name: Verify detailed lake surface bindings
        run: python -B tools/terrain/test_lake_surfaces.py
      - name: Verify sourced military authority inputs
        run: python -B tools/politics/build_army_authority.py --source tools/politics/fixtures/vdem-v16-1989-military-authority.json --nations spheres-sim/data/nations --output spheres-sim/data/army_authority_1989.json --check
      - name: Verify military authority source controls
        run: python -B -m unittest discover -s tools/politics -p "test_*.py"
      - name: Verify bounded resource coverage metadata
        run: python -B tools/resources/resource_coverage.py --check
      - name: Verify source-backed resource coverage controls
        run: python -B -m unittest discover -s tools/resources -p "test_coverage.py"
      - name: Validate campaign assignments and bounded task queue
        run: python -B tools/planning/workboard.py --check
      - name: Verify task queries and dependency guards
        run: python -B -m unittest discover -s tools/planning -p "test_*.py"
      - name: Verify historical research and fictional character contracts
        run: python -B -X utf8 -m unittest discover -s tools/avatars -p "test_*.py"
      - name: Verify strict native stability evidence orchestration
        run: python -B -m unittest discover -s tools/campaign -p "test_*stability*.py"
      - name: Verify release packaging and extraction guards
        run: python -B -m unittest discover -s tools/release -p "test_*.py"
      - name: Verify extracted smoke boundary guards
        run: node --test tools/release/test_smoke_package.cjs
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json
      # The absolute resource timing limit is load-sensitive. Keep its original
      # assertion, but measure it without the parallel simulation suite running.
      - run: cargo test --locked --release --workspace --no-fail-fast -- --skip tests::the_resource_pass_stays_under_budget
      - name: Verify resource timing budget in isolation
        run: cargo test --locked --release -p spheres-sim --lib tests::the_resource_pass_stays_under_budget -- --exact --nocapture --test-threads=1
      - run: cargo build --locked --release -p spheres-web
      - run: npm ci --prefix tools/ui
      - run: npx --prefix tools/ui playwright install --with-deps chromium
      - run: node tools/ui/ci-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: artifacts/browser-ci
  # Exercise shipped bytes independently: an unrelated existing calibration or
  # source-browser failure must not hide portable-package diagnostics.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary: target/release/spheres-web
          - os: windows-latest
            platform: windows
            binary: target/release/spheres-web.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json
      - run: cargo build --locked --release -p spheres-web
      - name: Retain dependency license metadata for this locked release
        run: cargo fetch --locked
      - run: npm ci --prefix tools/ui
      - run: npx --prefix tools/ui playwright install --with-deps chromium
      - name: Package the exact native executable without an implicit source patch
        run: python -B tools/release/package_windows.py --binary "${{ matrix.binary }}" --output artifacts/release --name SPHERES-ci --platform "${{ matrix.platform }}"
      - name: Verify extraction and ordinary offline play from shipped bytes
        run: node tools/release/smoke_package.cjs artifacts/release/SPHERES-ci.zip "${{ github.sha }}" artifacts/package-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-package-${{ matrix.os }}
          # Compress the artifact transport only; the deterministic inner ZIP
          # and its checksums remain byte-for-byte unchanged after download.
          compression-level: 6
          retention-days: 7
          path: |
            artifacts/release/*.zip
            artifacts/package-smoke/result.json
            artifacts/package-smoke/extraction.json
            artifacts/package-smoke/*.log
            artifacts/package-smoke/*.jsonl
            artifacts/package-smoke/*.png
            artifacts/package-smoke/*.html
            artifacts/package-smoke/*.json.gz
  # This static WebGL harness needs no native executable. Give it an independent
  # allowance so a cold Windows Rust build cannot consume its execution time.
  town-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json
      - run: npm ci --prefix tools/ui
      - run: npx --prefix tools/ui playwright install --with-deps chromium
      - name: Verify actual adaptive town submissions and recovery
        env:
          SPHERES_BROWSER_CHANNEL: chromium
          SPHERES_ART_OUTPUT: artifacts/town-scene-browser
        run: node tools/ui/town-scene-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-scene-evidence-${{ matrix.os }}
          path: artifacts/town-scene-browser
  # The opt-in political model has ten historical outcome gates. Run even
  # the gates kept out of the default suite while calibration was incomplete;
  # the separate measurement-only census is not an acceptance test.
  political-calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require all ten political outcome gates and attribution controls
        run: cargo test --locked --release -p spheres-sim --test bloc_census -- --include-ignored --skip bloc_census
  # Preserve the original required-check names, each covering every suite.
  verify:
    if: always()
    needs: [javascript, native, package, town-browser, political-calibration]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Require every native, JavaScript, town and political check to pass
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          TOWN_BROWSER_RESULT: ${{ needs['town-browser'].result }}
          POLITICAL_RESULT: ${{ needs['political-calibration'].result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: python -c "import os,sys; results={key:os.environ[key] for key in ('NATIVE_RESULT','JAVASCRIPT_RESULT','TOWN_BROWSER_RESULT','POLITICAL_RESULT','PACKAGE_RESULT')}; print(results); sys.exit(0 if all(value=='success' for value in results.values()) else 1)"
